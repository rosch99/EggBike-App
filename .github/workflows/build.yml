name: APK bauen

# Baut bei jedem Upload/Push automatisch eine installierbare Debug-APK
# und hängt sie an eine Release-Seite namens "neueste-apk".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# Fremde Actions sind auf feste Commits festgelegt (Kommentar = Version). Ein verschobener oder
# kompromittierter Versions-Tag kann so keinen fremden Code mit Zugriff auf den Signaturschlüssel
# einschleusen. Zum Aktualisieren den neuen Commit des Tags eintragen.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Java 17 einrichten
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Projektordner finden
        id: find
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path '*/build/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "FEHLER: keine settings.gradle im Repo gefunden."
            echo "Vorhandene Dateien:"; find . -maxdepth 2 -type f | sort
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Gradle-Projekt gefunden in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Signaturschlüssel einrichten
        env:
          KS: ${{ secrets.EGG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/eggbike-release.jks"
            echo "EGG_KEYSTORE_FILE=$RUNNER_TEMP/eggbike-release.jks" >> "$GITHUB_ENV"
            echo "Fester Signaturschlüssel aktiv."
          else
            echo "::warning::Secret EGG_KEYSTORE_BASE64 fehlt – die APK wird mit wechselndem Debug-Schlüssel signiert und lässt sich nicht über die vorige installieren."
          fi

      - name: Gradle-Wrapper erzeugen
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle wrapper --gradle-version 8.7

      - name: APK bauen
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          EGG_KEYSTORE_PASSWORD: ${{ secrets.EGG_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Signatur prüfen
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          EGG_KEYSTORE_PASSWORD: ${{ secrets.EGG_KEYSTORE_PASSWORD }}
        # Zeigt Konfiguration und SHA-256 des Schlüssels, mit dem die Debug-APK signiert wird.
        # Nur Anzeige, bricht den Build nicht ab.
        run: |
          ./gradlew signingReport --no-daemon -q 2>&1 | grep -A7 -E "^Variant: debug$" || echo "::warning::Signatur konnte nicht angezeigt werden"

      - name: Signaturschlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/eggbike-release.jks"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EggRiderLogger-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: APK als Release veröffentlichen
        # Nur von main: Testläufe anderer Branches überschreiben die veröffentlichte APK nicht.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: neueste-apk
          name: Neueste APK
          files: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          body: Automatisch gebaute Debug-APK. Zum Installieren auf dem Handy herunterladen.
