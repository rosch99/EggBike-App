plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.eggriderng.logger'
    compileSdk 34

    defaultConfig {
        applicationId "com.eggriderng.logger"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "0.30"
    }

    // Fester Signaturschlüssel: In GitHub Actions aus den Secrets EGG_KEYSTORE_BASE64 und
    // EGG_KEYSTORE_PASSWORD (siehe build.yml). Damit lässt sich jede neue APK über die alte
    // installieren. Ohne Schlüssel (z. B. lokal) wird wie bisher mit dem Debug-Schlüssel signiert.
    def eggKeystore = System.getenv("EGG_KEYSTORE_FILE")
    def eggPassword = System.getenv("EGG_KEYSTORE_PASSWORD")
    def useFixedKey = eggKeystore && eggPassword && file(eggKeystore).exists()

    signingConfigs {
        if (useFixedKey) {
            fixed {
                storeFile file(eggKeystore)
                storePassword eggPassword
                keyAlias "eggbike"
                keyPassword eggPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            if (useFixedKey) signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.webkit:webkit:1.11.0'
}
